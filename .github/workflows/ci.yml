name: Build

# Every push to main and every pull request: unit tests, type check, and the package.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Type check
        run: npm run typecheck
      - name: Unit tests and package
        run: node tools/package.mjs
      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
